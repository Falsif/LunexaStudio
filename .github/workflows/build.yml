name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug + release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --console=plain 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Все ошибки одной аннотацией (GitHub показывает максимум 10 аннотаций на шаг)
          { grep -E "^e: |^\[ksp\]|error:" build.log | head -40; echo "-----"; grep -A 12 "What went wrong" build.log | head -40; } > errors.txt || true
          msg=$(sed -e 's/%/%25/g' errors.txt | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Build errors::${msg}"
      - uses: actions/upload-artifact@v4
        with:
          name: LUNEXA-Studio-APK
          path: app/build/outputs/apk/**/*.apk
